name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build worker
        run: npm run build --workspace @cc/worker
      - name: Test worker
        run: npm run test --workspace @cc/worker
      - name: Test dashboard input and saving
        run: npm test --workspace @cc/web
      - name: Build dashboard
        run: npm run build --workspace @cc/web
        env:
          VITE_API_BASE_URL: https://api.example.com
