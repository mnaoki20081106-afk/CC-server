name: Deploy CC-Server dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Write API config
        run: |
          API_URL="${{ vars.CC_SERVER_WORKER_URL || 'https://cc-server.workers.dev' }}"
          echo "window.CC_SERVER_API = '${API_URL}';" > apps/web/config.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
