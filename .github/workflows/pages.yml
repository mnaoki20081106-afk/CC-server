# CC-Server dashboard
name: Deploy CC-Server dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate dashboard API URL
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://cc-server.mnaoki20081106.workers.dev' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository Variable VITE_API_BASE_URL is required. Set it to the actual deployed cc-server Worker HTTPS origin."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_API_BASE_URL must use https://"
              exit 1
              ;;
          esac
      - name: Build dashboard
        run: npm run build --workspace @cc/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://cc-server.mnaoki20081106.workers.dev' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
