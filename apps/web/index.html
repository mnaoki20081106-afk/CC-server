<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CC-Server 管理サイト</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login-view" class="view">
    <div class="login-card">
      <h1>CC-Server 管理サイト</h1>
      <form id="login-form">
        <input id="password-input" type="password" placeholder="管理パスワード" autocomplete="current-password" required>
        <button type="submit">ログイン</button>
      </form>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <div id="app-view" class="view hidden">
    <nav class="sidebar">
      <div class="sidebar-header">
        <span>CC-Server</span>
      </div>
      <div id="guild-list" class="guild-list"></div>
      <button id="logout-btn" class="logout-btn">ログアウト</button>
    </nav>
    <main class="main">
      <div id="no-guild" class="placeholder">サーバーを選択してください</div>
      <div id="guild-panel" class="hidden">
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="config">サーバー設定</button>
          <button class="tab-btn" data-tab="panels">パネル</button>
          <button class="tab-btn" data-tab="amazon">Amazon自販機</button>
        </div>

        <!-- config tab -->
        <section id="tab-config" class="tab-content">
          <h2>サーバー設定</h2>
          <form id="config-form" class="form-grid">
            <label>管理者ロール <select name="admin_role_id" id="sel-admin-role"><option value="">なし</option></select></label>
            <label>モデレーターロール <select name="mod_role_id" id="sel-mod-role"><option value="">なし</option></select></label>
            <label>ログチャンネル <select name="log_channel_id" id="sel-log-ch"><option value="">なし</option></select></label>
            <label>認証済みロール <select name="verified_role_id" id="sel-verified-role"><option value="">なし</option></select></label>
            <label>認証チャンネル <select name="verify_channel_id" id="sel-verify-ch"><option value="">なし</option></select></label>
            <label>入室メッセージ送信先 <select name="welcome_channel_id" id="sel-welcome-ch"><option value="">なし</option></select></label>
            <label class="full">入室メッセージ ({user} でメンション) <input name="welcome_message" type="text"></label>
            <label>退室メッセージ送信先 <select name="leave_channel_id" id="sel-leave-ch"><option value="">なし</option></select></label>
            <label class="full">退室メッセージ ({user} でメンション) <input name="leave_message" type="text"></label>
            <fieldset class="full">
              <legend>Anti-Spam</legend>
              <label><input name="anti_spam_enabled" type="checkbox"> 有効</label>
              <label>閾値 <input name="anti_spam_threshold" type="number" min="1" max="50"></label>
              <label>ウィンドウ(ms) <input name="anti_spam_window_ms" type="number" min="1000" max="60000"></label>
            </fieldset>
            <fieldset class="full">
              <legend>Anti-Link</legend>
              <label><input name="anti_link_enabled" type="checkbox"> 有効</label>
              <label class="full">ホワイトリスト(JSON配列) <input name="anti_link_whitelist" type="text" placeholder='["example.com"]'></label>
            </fieldset>
            <fieldset class="full">
              <legend>Raid Protection</legend>
              <label><input name="raid_protection_enabled" type="checkbox"> 有効</label>
              <label>閾値(人) <input name="raid_join_threshold" type="number" min="2" max="100"></label>
              <label>ウィンドウ(ms) <input name="raid_window_ms" type="number" min="1000" max="60000"></label>
              <label>アクション
                <select name="raid_action">
                  <option value="lock">lock</option>
                  <option value="kick">kick</option>
                  <option value="ban">ban</option>
                </select>
              </label>
            </fieldset>
            <button type="submit" class="full">保存</button>
          </form>
          <p id="config-msg" class="msg hidden"></p>
        </section>

        <!-- panels tab -->
        <section id="tab-panels" class="tab-content hidden">
          <h2>パネル管理</h2>
          <div class="create-panel-form">
            <h3>新規パネル作成</h3>
            <input id="panel-title" type="text" placeholder="タイトル" required>
            <input id="panel-desc" type="text" placeholder="説明文（任意）">
            <button id="create-panel-btn">作成</button>
          </div>
          <div id="panel-list"></div>
        </section>

        <!-- amazon tab -->
        <section id="tab-amazon" class="tab-content hidden">
          <h2>Amazon自販機</h2>
          <form id="av-config-form" class="form-grid">
            <label class="full">パネルタイトル <input name="panel_title" type="text" maxlength="100"></label>
            <label class="full">パネル説明文 <textarea name="panel_description" rows="2" maxlength="500"></textarea></label>
            <label class="full">LTCアドレス <input name="ltc_address" type="text" placeholder="Lxxxxxxxxxx..."></label>
            <label>API種別
              <select name="api_type">
                <option value="rainforest">Rainforest API</option>
                <option value="keepa">Keepa API</option>
                <option value="canopy">Canopy API</option>
              </select>
            </label>
            <label class="full">APIキー <input name="api_key" type="password" placeholder="APIキー"></label>
            <button type="submit" class="full">設定保存</button>
          </form>
          <p id="av-config-msg" class="msg hidden"></p>
          <hr>
          <h3>パネルを設置</h3>
          <div class="post-row">
            <select id="av-post-ch"><option value="">チャンネルを選択</option></select>
            <button id="av-post-btn">投稿</button>
          </div>
          <p id="av-post-msg" class="msg hidden"></p>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
